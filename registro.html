<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Ejercicio Prácticas en Data Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <a href="index.html" class="back-link">← Volver</a>
      <h1>Crear cuenta</h1>

      <form class="form" onsubmit="handleRegistro(event)">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
            minlength="2"
          />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 8 caracteres"
            required
            minlength="8"
          />
          <small class="hint">Usa al menos 8 caracteres</small>
        </div>

        <div class="form-group">
          <label for="confirm">Confirmar contraseña</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Repite tu contraseña"
            required
          />
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="terms" required />
            Acepto los <a href="#" class="link">términos y condiciones</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Registrarse</button>

        <p class="form-footer">
          ¿Ya tienes cuenta? <a href="login.html" class="link">Iniciar sesión</a>
        </p>
      </form>

      <div id="mensaje" class="mensaje hidden"></div>
    </div>
  </div>

  <script>
    function handleRegistro(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const nombre = document.getElementById('nombre').value;
      const msg = document.getElementById('mensaje');

      if (password !== confirm) {
        msg.textContent = 'Las contraseñas no coinciden.';
        msg.className = 'mensaje error';
        return;
      }

      msg.textContent = `¡Cuenta creada con éxito! Bienvenido, ${nombre}.`;
      msg.className = 'mensaje success';
    }
  </script>
</body>
</html>
