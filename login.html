<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Ejercicio Prácticas en Data Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <a href="index.html" class="back-link">← Volver</a>
      <h1>Iniciar sesión</h1>

      <form class="form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Tu contraseña"
            required
            minlength="6"
          />
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" />
            Recordarme
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>

        <p class="form-footer">
          ¿No tienes cuenta? <a href="registro.html" class="link">Regístrate</a>
        </p>
      </form>

      <div id="mensaje" class="mensaje hidden"></div>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const msg = document.getElementById('mensaje');
      msg.textContent = `Bienvenido, ${email}`;
      msg.className = 'mensaje success';
    }
  </script>
</body>
</html>
